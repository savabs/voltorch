# Live arbitrage-free surface page: refit both Deribit chains every 30 minutes
# and publish docs/ to GitHub Pages. ~1 min per run, ~1,440 min/month, inside
# the free tier. The gate refuses to publish when a chain comes back thin.
name: surface

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: surface
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch && pip install -e '.[page]'
      - name: Refit and render
        # exit 1 when either chain has < 300 two-sided quotes: nothing is published
        run: python scripts/live_page.py
      - name: Commit
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -q -m "surface: $(date -u +%Y-%m-%dT%H:%M) [ci]" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push race, retry $i"; sleep 5
          done
          echo "FAILED to push"; exit 1
