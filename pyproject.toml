[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voltorch"
version = "0.1.0"
description = "Differentiable option pricing and volatility surfaces in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "savabs" }]
keywords = [
    "options", "derivatives", "quantitative-finance", "volatility",
    "heston", "sabr", "svi", "rough-volatility", "pytorch", "autograd",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["torch>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
sde = ["torchsde>=0.2.5"]
chain = ["requests>=2.31", "pandas>=2.0"]
page = ["requests>=2.31", "pandas>=2.0", "matplotlib>=3.8"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/savabs/voltorch"
Issues = "https://github.com/savabs/voltorch/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/voltorch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
